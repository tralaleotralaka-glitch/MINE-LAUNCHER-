name: Build APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true

      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/MineLauncher-1.0.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MineLauncher-apk
          path: out/MineLauncher-1.0.apk
          if-no-files-found: error

      - name: Save build log on failure
        if: failure()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "# CI build log"
            echo
            echo '```'
            tail -c 60000 build-log.txt || true
            echo '```'
          } > CI_BUILD_LOG.md
          git add CI_BUILD_LOG.md
          git commit -m "ci: build log [skip ci]" || exit 0
          git push

      - name: Publish GitHub release with APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: Mine Launcher 1.0 (APK)
          body: |
            Автоматическая сборка APK из ветки `${{ github.ref_name }}` (коммит `${{ github.sha }}`).

            Установка: скачайте `MineLauncher-1.0.apk` на телефон и откройте файл
            (разрешите установку из неизвестных источников).
          files: out/MineLauncher-1.0.apk
          draft: false
          prerelease: false
