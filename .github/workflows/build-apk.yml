name: Build APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true

      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          { ls -l "$APK"; "$BT/aapt2" dump badging "$APK" | head -12; echo "-- contents --"; unzip -l "$APK" | tail -15; } > info.txt
          cat info.txt
          MSG=$(awk '{printf "%s%%0A", $0}' info.txt)
          echo "::notice title=apk-info::$MSG"

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/MineLauncher-1.0.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MineLauncher-apk
          path: out/MineLauncher-1.0.apk
          if-no-files-found: error

      - name: Save build log on failure
        if: failure()
        run: |
          { echo "# CI build log"; echo; echo '```'; tail -c 60000 build-log.txt 2>/dev/null || echo "(gradle produced no log)"; echo '```'; } > CI_BUILD_LOG.md
          ls -la CI_BUILD_LOG.md
          git add -f CI_BUILD_LOG.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "ci: build log [skip ci]" --allow-empty
          git push origin HEAD:${GITHUB_REF#refs/heads/}
          MSG=$(tail -c 2500 build-log.txt 2>/dev/null | awk '{printf "%s%%0A", $0}')
          echo "::error title=gradle failure::$MSG"

      - name: Publish GitHub release with APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: Mine Launcher 1.0 (APK)
          body: |
            Автоматическая сборка APK из ветки `${{ github.ref_name }}` (коммит `${{ github.sha }}`).

            Установка: скачайте `MineLauncher-1.0.apk` на телефон и откройте файл
            (разрешите установку из неизвестных источников).
          files: out/MineLauncher-1.0.apk
          draft: false
          prerelease: false
